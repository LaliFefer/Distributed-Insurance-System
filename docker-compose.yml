# Policy DB on host 5432, Payment DB on host 5433; Kafka (KRaft), Redis, Zipkin.
# Copy .env.example to .env and adjust secrets/ports (see README).
#
# Kafka / KRaft stale cluster state: after changing CLUSTER_ID or image major version,
# remove the Kafka volume before bringing the stack up again, for example:
#   docker compose down
#   docker volume rm insurance-system_kafka_data
# Or: docker compose down -v   # drops all compose volumes (Postgres/Redis too).

services:
  postgres-policy:
    image: postgres:16-alpine
    container_name: insurance-postgres-policy
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: policy_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_POLICY_PORT:-5432}:5432"
    volumes:
      - postgres_policy_data:/var/lib/postgresql/data
    networks:
      - insurance_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d policy_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres-payment:
    image: postgres:16-alpine
    container_name: insurance-postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: payment_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PAYMENT_PORT:-5433}:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    networks:
      - insurance_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.1
    container_name: insurance-kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PUBLIC_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "${KAFKA_PUBLIC_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - insurance_net
    healthcheck:
      # שימוש בנתיב המלא של הסקריפט למניעת שגיאות PATH
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: insurance-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - insurance_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  zipkin:
    image: openzipkin/zipkin:3
    container_name: insurance-zipkin
    restart: unless-stopped
    environment:
      STORAGE_TYPE: mem
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - insurance_net
    healthcheck:
      test: ["CMD", "docker-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  policy-service:
    build:
      context: .
      dockerfile: policy-service/Dockerfile
    # Pre-built images from GitHub Actions → GHCR (see .github/workflows/deploy.yml).
    # Override GHCR_IMAGE_OWNER if your GitHub username/org differs from the default.
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_IMAGE_OWNER:-lalifefer}/policy-service:${SERVICE_IMAGE_TAG:-latest}
    container_name: insurance-policy-service
    restart: unless-stopped
    ports:
      - "${POLICY_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-policy:5432/policy_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-insurance}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres-policy:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - insurance_net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_IMAGE_OWNER:-lalifefer}/payment-service:${SERVICE_IMAGE_TAG:-latest}
    container_name: insurance-payment-service
    restart: unless-stopped
    ports:
      - "${PAYMENT_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-insurance}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - insurance_net

networks:
  insurance_net:
    name: insurance_net
    driver: bridge

volumes:
  postgres_policy_data:
  postgres_payment_data:
  kafka_data:
  redis_data: