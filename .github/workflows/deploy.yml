# Build and push Spring Boot service images to GitHub Container Registry (GHCR).
# Images: ghcr.io/<repository-owner-lowercase>/policy-service:latest
#         ghcr.io/<repository-owner-lowercase>/payment-service:latest
#
# After the first successful run, set package visibility to "Public" if you want
# anonymous `docker pull` (GitHub → Packages → each image → Package settings).

name: Publish Docker images to GHCR

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository owner (Docker tag compatibility)
        id: owner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push policy-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: policy-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/policy-service:latest

      - name: Build and push payment-service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: payment-service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lc }}/payment-service:latest
